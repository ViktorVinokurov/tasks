name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm run typecheck
        working-directory: client
      - run: npm run build
        working-directory: client

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: pytest
        working-directory: backend

  docker:
    runs-on: ubuntu-latest
    needs: [verify, backend]
    outputs:
      web_image: ${{ steps.names.outputs.web }}:${{ github.sha }}
      api_image: ${{ steps.names.outputs.api }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: names
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "web=${REGISTRY}/${repo}/web" >> "$GITHUB_OUTPUT"
          echo "api=${REGISTRY}/${repo}/api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./client
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          provenance: false
          tags: |
            ${{ steps.names.outputs.web }}:${{ github.sha }}
            ${{ steps.names.outputs.web }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          provenance: false
          tags: |
            ${{ steps.names.outputs.api }}:${{ github.sha }}
            ${{ steps.names.outputs.api }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Добавьте секрет репозитория: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          WEB_IMAGE: ${{ needs.docker.outputs.web_image }}
          API_IMAGE: ${{ needs.docker.outputs.api_image }}
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts || ! grep -q . ~/.ssh/known_hosts; then
            echo "Не удалось получить ключ хоста ${VPS_HOST}:${port}. Проверьте VPS_HOST и VPS_PORT." >&2
            exit 1
          fi
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -p "$port" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes)
          scp_opts=(-i "$HOME/.ssh/deploy_key" -P "$port" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/ezhednevnik"
          scp "${scp_opts[@]}" docker-compose.prod.yml .env.example "$VPS_USER@$VPS_HOST:/opt/ezhednevnik/"
          {
            printf 'export GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            printf 'export GHCR_USER=%q\n' "$GHCR_USER"
            printf 'export WEB_IMAGE=%q\n' "$WEB_IMAGE"
            printf 'export API_IMAGE=%q\n' "$API_IMAGE"
            cat deploy/vps.sh
          } | ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "bash -s"

          {
            echo "### Deploy"
            echo "- host: \`$VPS_HOST\`"
            echo "- web: \`$WEB_IMAGE\`"
            echo "- api: \`$API_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
